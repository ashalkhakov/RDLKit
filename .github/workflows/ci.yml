name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier one is still running supersedes it; there
# is no value in finishing CI for a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ########################### macOS / Cocoa ###########################
  # Runs on every push, so every commit leaves a build to download. Note that
  # macOS minutes bill at 10x on a private repository: restoring
  #   if: github.event_name != 'push' || github.ref == 'refs/heads/master'
  # confines it to pull requests and the default branch again.
  macos:
    name: macOS (Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # Built first and on its own, so a compile error in the library is
      # reported as that rather than as a test failure.
      - name: Build RDLKit
        run: |
          xcodebuild -project RDLKit.xcodeproj -scheme RDLKit \
            -destination 'platform=macOS' -configuration Debug build

      - name: Build the designer and the CLI
        run: |
          for scheme in RDLDesigner RDLGen; do
            xcodebuild -project RDLKit.xcodeproj -scheme "$scheme" \
              -destination 'platform=macOS' -configuration Debug build
          done

      - name: Test RDLKit
        run: |
          xcodebuild -project RDLKit.xcodeproj -scheme RDLKitTests \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/RDLKitTests.xcresult" test

      # The designer's cases open real modal panels, so they need a session
      # that can make windows. A GitHub macOS runner has one.
      - name: Test RDLDesigner
        run: |
          xcodebuild -project RDLKit.xcodeproj -scheme RDLDesignerTests \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/RDLDesignerTests.xcresult" test

      # 86 report definitions written by somebody else. The count is asserted
      # rather than merely printed, so a regression that quietly starts
      # refusing files fails the build.
      - name: RDL corpus coverage
        run: |
          .tools/rdl-coverage.sh > /tmp/coverage.txt 2> /tmp/coverage-tally.txt || true
          cat /tmp/coverage-tally.txt
          grep -q "0 silently empty" /tmp/coverage-tally.txt \
            || { echo "::error::a report parsed to nothing without complaining"; exit 1; }
          ok=$(sed -n 's/.*: \([0-9]*\) ok.*/\1/p' /tmp/coverage-tally.txt)
          [ "${ok:-0}" -ge 79 ] \
            || { echo "::error::corpus coverage fell to ${ok} of 86 (was 79)"; exit 1; }

      - name: Smoke-test rdlgen
        run: |
          built=$(xcodebuild -project RDLKit.xcodeproj -scheme RDLGen \
                    -destination 'platform=macOS' -showBuildSettings 2>/dev/null \
                  | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          sample=Examples/majorsilence/ReportTests/Reports/MatrixExample.rdl
          DYLD_FRAMEWORK_PATH="$built" "$built/rdlgen" "$sample" --check
          DYLD_FRAMEWORK_PATH="$built" "$built/rdlgen" "$sample" --contract > /dev/null
          DYLD_FRAMEWORK_PATH="$built" "$built/rdlgen" "$sample" -f html -o /tmp/out.html
          DYLD_FRAMEWORK_PATH="$built" "$built/rdlgen" "$sample" -o /tmp/out.pdf
          test -s /tmp/out.html && test -s /tmp/out.pdf

      # Unsigned: signing needs the Developer ID secrets and belongs to a
      # release. These are for trying a build, and say so in the name.
      - name: Package
        run: |
          built=$(xcodebuild -project RDLKit.xcodeproj -scheme RDLDesigner \
                    -destination 'platform=macOS' -showBuildSettings 2>/dev/null \
                  | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          # rdlgen links @rpath/RDLKit.framework, so the executable on its own
          # will not start. Ship it beside the framework it needs.
          rm -rf "$RUNNER_TEMP/rdlgen" && mkdir -p "$RUNNER_TEMP/rdlgen"
          cp "$built/rdlgen" "$RUNNER_TEMP/rdlgen/"
          cp -R "$built/RDLKit.framework" "$RUNNER_TEMP/rdlgen/"
          ditto -c -k --keepParent "$built/RDLDesigner.app" "RDLDesigner-macOS-unsigned.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/rdlgen" "rdlgen-macOS-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: RDLKit-macOS-${{ github.sha }}
          path: |
            RDLDesigner-macOS-unsigned.zip
            rdlgen-macOS-unsigned.zip
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7

  ########################### GNUstep / Linux ###########################
  gnustep:
    name: Ubuntu (GNUstep, clang, gnustep-2.0)
    runs-on: ubuntu-latest
    # The dependency build is the long pole; everything after it is minutes.
    timeout-minutes: 90
    env:
      SRC_PATH: ${{ github.workspace }}/source
      DEPS_PATH: ${{ github.workspace }}/dependencies
      INSTALL_PATH: ${{ github.workspace }}/build
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      # libobjc2 and libdispatch land in the prefix's plain lib/, which the
      # gnustep layout does not treat as a library root. GNUstep.sh prepends
      # the roots it does know about to this.
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
    defaults:
      run:
        working-directory: ${{ env.SRC_PATH }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.SRC_PATH }}

      # Seconds, and before the half-hour dependency build. CoreGraphics is a
      # macOS framework: importing it compiles fine on a Mac and breaks the
      # GNUstep build, which is a slow way to find out. CGFloat and the NS
      # geometry types come from Foundation on both platforms.
      - name: No macOS-only imports
        run: |
          if grep -rn "CoreGraphics\|<Cocoa/Cocoa.h>\|QuartzCore" \
               --include="*.h" --include="*.m" RDLKit RDLDesigner RDLGen \
               RDLKitTests RDLDesignerTests; then
            echo "::error::a macOS-only framework is imported; GNUstep has no such header"
            exit 1
          fi
          echo "none found"

      - name: Install packages
        run: |
          sudo apt-get -q -y update
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev libavahi-client-dev zlib1g-dev gnutls-bin libcurl4-gnutls-dev \
            libgmp-dev libcairo2-dev libjpeg-dev libtiff-dev libpng-dev libicns-dev \
            libpthread-workqueue-dev \
            libxt-dev libxmu-dev libxft-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            xvfb
          # The gnustep-2.0 runtime needs ld.gold or lld. ld.gold is gone from
          # binutils on newer Ubuntu, so fall back to lld rather than failing
          # on a missing alternative.
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi
          ld --version | head -1

      # The whole GNUstep stack is built from source, which takes far longer
      # than RDLKit does. It only changes when the pinned dependency script
      # changes, so it is cached against that.
      #
      # Restored and saved as two separate steps rather than with the combined
      # action, because the combined one saves at the end of the job -- by
      # which time packaging has run "make install
      # GNUSTEP_INSTALLATION_DOMAIN=SYSTEM" and put RDLKit's own headers into
      # the prefix. The next run then restores a prefix containing them, and
      # every declaration is seen twice: once from
      # System/Library/Headers/RDLKit and once from ../RDLKit. Saving here
      # captures the stack before anything of ours is installed into it.
      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v2-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh') }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/dependencies.sh

      - name: Save GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v2-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh') }}

      - name: Build RDLKit
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make -C RDLKit

      - name: Build the CLI and the designer
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make -C RDLGen
          make -C RDLDesigner

      # Both suites are ordinary XCTest, which GNUstep supplies through
      # tools-xctest. `make run-tests` builds the bundle and runs it under
      # xctest. SANITIZE=1 while the port is being brought up: a segfault or a
      # heap overflow then arrives as a symbolized backtrace naming the write,
      # rather than as one line saying the process died.
      - name: Test RDLKit
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          # Where gnustep-make installed the backend, and where libs-base
          # looks for it at runtime, are two different questions, and
          # "Unable to find backend back" is printed when either is wrong.
          echo "config file:  $(gnustep-config --variable=GNUSTEP_CONFIG_FILE)"
          echo "system lib:   $(gnustep-config --variable=GNUSTEP_SYSTEM_LIBRARY)"
          ls -la "$INSTALL_PATH/etc" 2>&1 | head
          find "$INSTALL_PATH" -maxdepth 6 -name 'libgnustep-back*' -o -maxdepth 6 -name 'GNUstep.conf'
          xvfb-run -a make -C RDLKitTests run-tests SANITIZE=1

      - name: Test RDLDesigner
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          xvfb-run -a make -C RDLDesignerTests run-tests SANITIZE=1

      - name: Smoke-test rdlgen
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          # Find what was actually built rather than assuming gnustep-make's
          # object directory is called "obj": it varies with the library combo.
          lib=$(find RDLKit -name 'libRDLKit*' -print -quit)
          tool=$(find RDLGen -name rdlgen -type f -print -quit)
          echo "library: $lib"
          echo "tool:    $tool"
          export LD_LIBRARY_PATH="$(dirname "$lib"):$LD_LIBRARY_PATH"
          sample=Examples/majorsilence/ReportTests/Reports/MatrixExample.rdl
          run() {
            # A stall here should report as one, not sit until the job's
            # timeout: GNUstep renders PDF through its print machinery, which
            # invents a default printer when none is configured.
            timeout 120 "$@" || {
              status=$?
              [ $status -eq 124 ] && echo "::error::timed out after 120s: $*"
              exit $status
            }
          }
          run xvfb-run -a "$tool" "$sample" --check
          run xvfb-run -a "$tool" "$sample" -f html -o /tmp/out.html
          test -s /tmp/out.html
          # PDF is not exercised here: -dataWithPDFInsideRect: goes through
          # GNUstep's print machinery, which invents a default printer when
          # none is configured and then never returns. See
          # Patches/gnustep-pdf-hangs-headless.md. The macOS job covers PDF.

      # Packaged on every commit, unstable ones included, so there is always a
      # build to hand someone. Signed releases are release.yml's job; these are
      # named for the commit they came from and expire.
      - name: Fetch linuxdeploy and the AppImage runtime
        run: ./Scripts/install-linuxdeploy.sh

      - name: Package the AppImage
        env:
          LDAI_RUNTIME_FILE: /tmp/appimage-runtime/runtime-x86_64
          APP_VERSION: 0.0.0-${{ github.run_number }}-${{ github.sha }}
        run: |
          sudo apt-get -q -y install desktop-file-utils fonts-dejavu fonts-liberation
          echo "packages installed"
          GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/prepare-appdir.sh
          echo "AppDir assembled"
          GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/package-appimage.sh

      # It has to start. --check needs no display, so a bundle that cannot find
      # its own runtime fails here rather than for whoever downloads it.
      - name: Smoke-test the AppImage
        run: |
          image=$(ls RDLKit-Linux-*.AppImage)
          chmod +x "$image"
          timeout 120 ./"$image" rdlgen \
            Examples/majorsilence/ReportTests/Reports/MatrixExample.rdl --check

      - uses: actions/upload-artifact@v4
        with:
          name: RDLKit-Linux-${{ github.sha }}
          path: ${{ env.SRC_PATH }}/RDLKit-Linux-*.AppImage
          retention-days: 14
