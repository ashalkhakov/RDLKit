# RDLKit's Windows installer: RDLDesigner, and rdlgen beside it in the
# runtime. The installer is gnustep-release-actions' msi (the runtime,
# WinUXTheme), the same as every app's; see its msi.sh for each name.
NAME=RDLDesigner
APPS="RDLDesigner"
DEFAULT=RDLDesigner
ICON=RDLDesigner/RDLDesigner.png
SUMMARY="Design and run RDL reports: RDLDesigner, and rdlgen to render them"
# No self-test: started bare the designer is still up 25 seconds later, its
# interface loaded.
SMOKE_STAYS_UP=25
