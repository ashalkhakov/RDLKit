# RDLKit's AppImage: RDLDesigner, and rdlgen beside it. The image is
# gnustep-release-actions' appimage (the launcher, the runtime, the fonts),
# the same as every app's; see its appimage.sh for each name.
# Not "-Linux": an .AppImage says what it is for (AppImage asks names not to).
IMAGE=RDLKit
NAME=RDLDesigner
APPS="RDLDesigner"
TOOLS="rdlgen"
DEFAULT=RDLDesigner
#   <image> rdlgen report.rdl -o report.pdf     ln -s <image> rdlgen
ROUTES="rdlgen=rdlgen designer,rdldesigner=RDLDesigner"
# A report's path: the designer opens it.
WITH_FILE=RDLDesigner
ENTRIES="Scripts/appimage/RDLDesigner.desktop=RDLDesigner/RDLDesigner.png"
# On a clean Ubuntu: rdlgen checks a sample report (no display needed).
SMOKE="rdlgen Examples/majorsilence/ReportTests/Reports/MatrixExample.rdl --check"
