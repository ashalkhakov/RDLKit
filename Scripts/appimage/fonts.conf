<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for the bundled fonts, plus whatever the host has.

     A report names the fonts its author had. Shipping a set means a report
     lays out the same way on a machine that has none of them installed, which
     is the difference between a page that fits and one that clips. -->
<fontconfig>
  <dir prefix="relative">../share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <config><rescan><int>30</int></rescan></config>
</fontconfig>
